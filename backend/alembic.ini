# Alembic configuration file

[alembic]
script_location = alembic
sqlalchemy.url = postgresql://user:password@localhost:5432/asset_mgmt
# Note: this URL is overridden at runtime by alembic/env.py which reads
# the DATABASE_URL from the app config / environment variables.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
