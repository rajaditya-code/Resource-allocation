# Render deployment blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: asset-mgmt-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asset-mgmt-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: asset-mgmt-db
    plan: free
    databaseName: asset_mgmt
    user: asset_mgmt_user
